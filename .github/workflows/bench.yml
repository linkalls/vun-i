name: Benchmark vun-i

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  benchmark:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup V
        uses: vlang/setup-v@v1.3
        with:
          check-latest: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Generate dummy package.json
        shell: powershell
        run: |
          @'
          {
            "dependencies": {
              "zod": "^4.3.6",
              "hono": "^4.12.9",
              "nanoid": "^5.1.5",
              "kleur": "^4.1.5"
            }
          }
          '@ | Set-Content -Path package.json

      - name: Benchmark bun install
        shell: powershell
        run: |
          $bunResult = Measure-Command { bun install }
          "bun install: $($bunResult.TotalMilliseconds) ms" | Tee-Object -FilePath bun-benchmark.txt
          if (Test-Path node_modules) {
            Remove-Item -Recurse -Force node_modules
          }
          if (Test-Path bun.lock) {
            Remove-Item -Force bun.lock
          }

      - name: Compile vun-i
        run: v -prod -o vun.exe vun.v

      - name: Benchmark vun-i
        shell: powershell
        run: |
          $vunResult = Measure-Command { .\vun.exe }
          "vun-i: $($vunResult.TotalMilliseconds) ms" | Tee-Object -FilePath vun-benchmark.txt

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            bun-benchmark.txt
            vun-benchmark.txt
            bun.lock
